#version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: bar-explorer-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - bar-explorer-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  apache:
    image: httpd:2.4
    container_name: bar-explorer-apache
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/var/www/html:ro
      - ./apache-config/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bar-explorer-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bar-explorer-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src              
      - ./backend/package.json:/app/package.json
      - ./backend/package-lock.json:/app/package-lock.json
    environment:
      NODE_ENV: development                 
      DB_HOST: mysql
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: 3306
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bar-explorer-network

volumes:
  mysql_data:
    driver: local

networks:
  bar-explorer-network:
    driver: bridge