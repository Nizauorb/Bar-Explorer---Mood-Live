# Configuration Apache pour Bar Explorer
ServerRoot "/usr/local/apache2"
Listen 80

# Modules essentiels
LoadModule mpm_prefork_module modules/mod_mpm_prefork.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule headers_module modules/mod_headers.so
LoadModule mime_module modules/mod_mime.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule dir_module modules/mod_dir.so
LoadModule unixd_module modules/mod_unixd.so

# Configuration principale
ServerAdmin admin@barexplorer.com
ServerName localhost

# DocumentRoot pour le frontend
DocumentRoot "/var/www/html"

# Configuration du frontend
<Directory "/var/www/html">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
    
    # Support du routing SPA
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule . /index.html [L]
</Directory>

# Proxy vers le backend Node.js
ProxyPreserveHost On
ProxyRequests Off

# API routes vers le backend
ProxyPass /api http://backend:3000/api
ProxyPassReverse /api http://backend:3000/api

# Health check
ProxyPass /health http://backend:3000/health
ProxyPassReverse /health http://backend:3000/health

# Headers CORS
Header always set Access-Control-Allow-Origin "*"
Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
Header always set Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization"

# Logs
ErrorLog /proc/self/fd/2
CustomLog /proc/self/fd/1 combined

# Types MIME
TypesConfig conf/mime.types
AddType application/json .json
AddType text/css .css
AddType application/javascript .js